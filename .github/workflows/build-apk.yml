name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'tool/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: 构建并签名分架构 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读出版本号
        id: ver
        run: echo "version=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成平台壳
        run: |
          flutter create --platforms=android,ios,windows,macos --org com.example --project-name yingshu "$RUNNER_TEMP/shell"
          cp -r "$RUNNER_TEMP/shell/android" "$RUNNER_TEMP/shell/ios" "$RUNNER_TEMP/shell/windows" "$RUNNER_TEMP/shell/macos" .
          flutter pub get

      - name: 写入品牌信息与图标
        run: bash tool/apply_branding.sh

      - name: 构建分架构 release APK
        run: flutter build apk --release --split-per-abi

      - name: 正式签名并整理产物
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash tool/sign_apk.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: yingshu-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 影枢 CineHub v${{ steps.ver.outputs.version }}
          body: |
            Android 安装包（按 CPU 架构拆分，装 arm64-v8a 那一个即可）：

            - `arm64-v8a`：绝大多数手机
            - `armeabi-v7a`：老机型 / 32 位设备
            - `x86_64`：模拟器与平板

            订阅源格式：苹果CMS v10 采集接口（`/api.php/provide/vod/`），
            可直接导入 TVBox 配置（含 `sites` / `urls`）与本地 JSON。
          files: dist/*.apk
          fail_on_unmatched_files: false
