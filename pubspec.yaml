name: yingshu
description: 影枢 CineHub —— 基于苹果CMS v10 采集接口的跨端流媒体播放器（订阅源聚合 / 点播 / 进度记忆）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# media_kit 传递依赖的 package_info_plus 会解析到 9.x，它要求 Flutter 3.29+ 的 Gradle 配置，
# 在 Flutter 3.24 上会报 "Could not get unknown property 'flutter'"。锁在 8.x。
dependency_overrides:
  package_info_plus: 8.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png

# 执行 `dart run flutter_launcher_icons` 会按下面配置生成 Android / iOS / Windows 图标。
# macOS 图标由 tool/apply_branding.ps1 补齐（避免旧版本插件不支持 macos 时报错）。
flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256
