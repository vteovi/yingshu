name: yingshu
description: 影枢 CineHub —— 基于苹果CMS v10 采集接口的跨端流媒体播放器（订阅源聚合 / 点播 / 进度记忆）
publish_to: 'none'
version: 0.23.1+2301

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  video_player: ^2.9.5
  screen_brightness: ^2.1.6
  volume_controller: ^3.7.1

# 播放内核：video_player（Android 侧 ExoPlayer，原生支持 m3u8 / HLS，拖动进度可靠）
# Android 用本地修正版 video_player_android：修了 SDK<29 时竖屏视频宽高未交换导致画面被拉伸的问题，
# 以及部分机型 H.264 High Profile 硬解失败时没有回退软解的问题。
dependency_overrides:
  video_player_android:
    path: third_party/video_player_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png

# 执行 `dart run flutter_launcher_icons` 会按下面配置生成 Android / iOS / Windows 图标。
# macOS 图标由 tool/apply_branding.ps1 补齐（避免旧版本插件不支持 macos 时报错）。
flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256
